# Publishing a new version: change __version__ in backend/version.py and push to main.
# If no release exists yet for that version, this runs the tests, builds the Windows installer and the Mac apps (Apple Silicon
# and Intel), and publishes release v<version> with all of them. The installed apps check these releases and update themselves.
# Pushes that keep the same version only run the tests. Running it by hand (workflow_dispatch) builds everything without
# publishing, to try the builds.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('backend/version.py').read()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "${{ github.repository }}" >/dev/null 2>&1; then echo "publish=false" >> "$GITHUB_OUTPUT"; else echo "publish=true" >> "$GITHUB_OUTPUT"; fi
          echo "Version $v"

  build:
    needs: test
    if: needs.test.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-desktop.txt
      - name: Indicator, copy and save tests on Windows
        shell: bash
        run: |
          python -m pytest -q -rfE --tb=line tests/test_tv_indicators.py tests/test_desktop.py -k "test_tv_indicators or clipboard or save" > pytest.txt 2>&1; code=$?
          cat pytest.txt
          if [ $code -ne 0 ]; then python -c "import sys;t=open('pytest.txt',encoding='utf-8',errors='replace').read()[-3500:];print('::error title=pytest-out::'+t.replace('%','%25').replace('\r','').replace('\n','%0A'))"; fi
          exit $code
      - run: choco install innosetup -y --no-progress
      - name: Build the app and the installer
        shell: pwsh
        run: ./installer/build.ps1 -Version "${{ needs.test.outputs.version }}" -Repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/installer/*.exe

  build-mac:
    needs: test
    if: needs.test.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple Silicon
            arch: arm64
          - runner: macos-15-intel     # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-desktop.txt
      - name: Indicator, copy and save tests on this Mac
        shell: bash
        run: |
          python -m pytest -q -rfE --tb=line tests/test_tv_indicators.py tests/test_desktop.py -k "test_tv_indicators or clipboard or save" > pytest.txt 2>&1; code=$?
          cat pytest.txt
          if [ $code -ne 0 ]; then python -c "import sys;t=open('pytest.txt',encoding='utf-8',errors='replace').read()[-3500:];print('::error title=pytest-out::'+t.replace('%','%25').replace('\r','').replace('\n','%0A'))"; fi
          exit $code
      - name: Build the Mac app, the .dmg and the update .zip
        run: bash installer/build_mac.sh "${{ needs.test.outputs.version }}" "${{ github.repository }}"
      - name: Start the built app, check the dashboard answers, quit
        env:
          NQES_DATA_DIR: ${{ runner.temp }}/qdata-smoke
          AUTO_UPDATE: "0"
          QDATA_SAVE_DIR: ${{ runner.temp }}
          QDATA_NO_REVEAL: "1"
          QDATA_SMOKE_STRICT: "1"
        run: |
          set +e
          ( "dist/Q DATA.app/Contents/MacOS/Q DATA" --smoke-test ) & pid=$!
          for i in $(seq 1 150); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then kill -9 $pid; echo "App did not quit within 150 s"; code=1; else wait $pid; code=$?; fi
          cat "$NQES_DATA_DIR/smoke.json" 2>/dev/null; echo
          echo "::notice title=Mac start-up test (${{ matrix.arch }})::exit $code $(cat "$NQES_DATA_DIR/smoke.json" 2>/dev/null)"
          tail -n 40 "$NQES_DATA_DIR"/logs/*.log 2>/dev/null
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            dist/installer/*.dmg
            dist/installer/*.zip

  publish:
    needs: [test, build, build-mac]
    # The Windows installer is required. A Mac build that failed is left out rather than holding back the release.
    if: always() && needs.test.outputs.publish == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: NQ-ES Options ${{ needs.test.outputs.version }}
          files: |
            out/*.exe
            out/*.dmg
            out/*.zip
          generate_release_notes: true
