# Publishing a new version: change __version__ in backend/version.py and push to main.
# If no release exists yet for that version, this runs the tests, builds the Windows installer and publishes release v<version>.
# The installed app checks these releases and updates itself. Pushes that keep the same version only run the tests.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('backend/version.py').read()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "${{ github.repository }}" >/dev/null 2>&1; then echo "publish=false" >> "$GITHUB_OUTPUT"; else echo "publish=true" >> "$GITHUB_OUTPUT"; fi
          echo "Version $v"

  build:
    needs: test
    if: needs.test.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-desktop.txt
      - run: choco install innosetup -y --no-progress
      - name: Build the app and the installer
        shell: pwsh
        run: ./installer/build.ps1 -Version "${{ needs.test.outputs.version }}" -Repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/installer/*.exe
      - name: Publish the release
        if: needs.test.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: NQ-ES Options ${{ needs.test.outputs.version }}
          files: dist/installer/*.exe
          generate_release_notes: true
