<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q DATA · NQ / ES options analytics</title>
<link rel="icon" href="icons/app.png">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
</head>
<body>
<header>
  <h1 class="brand"><img src="icons/app.png" alt=""><span class="qd">Q DATA</span><span class="sub">NQ / ES options analytics</span></h1>
  <div id="top"><span id="zoomctl" title="Text size. Ctrl and + / - also zoom the whole page."><button id="zm" aria-label="Smaller text">A-</button><button id="zp" aria-label="Bigger text">A+</button></span> <span id="mstate" class="badge">connecting</span> <span id="clock" class="dim"></span></div>
</header>
<div id="controls">
  <label>Data source <select id="src"></select></label>
  <label>Underlying <select id="u"></select></label>
  <label>Expiration <select id="exp" multiple size="1"></select></label>
  <label>Dealer sign scenario
    <select id="conv"><option value="standard">Standard: calls +, puts -</option><option value="customers_long">Reverse: calls -, puts +</option><option value="gross">Gross: no sign</option></select></label>
  <label>Futures mapping <select id="method"><option value="auto">Auto</option><option value="ratio">Ratio</option><option value="basis">Basis from a futures price (index only)</option><option value="typed_basis">Typed basis (NQ minus NDX)</option></select></label>
  <button id="reload">Refresh now</button>
  <button id="alertbtn">Alerts: off</button>
</div>
<div id="alerts" class="panel" style="display:none"></div>
<div id="toast"></div>
<nav id="tabs"></nav>
<div id="evbanner"></div>
<main id="view"><p class="dim">Loading...</p></main>
<footer class="dim">All numbers come from your local backend. The browser never sees your API key. Modeled values are estimates and depend on stated assumptions. This is decision support, not a prediction.</footer>
<script src="app.js"></script>
<script src="more.js"></script>
</body>
</html>
